[project]
name = "distributed-rate-limiter"
version = "0.1.0"
description = "A distributed API rate limiter demonstrating four algorithms with shared Redis state"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis[hiredis]>=5.0,<6",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "prometheus-client>=0.20,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.0,<4",
    "types-PyYAML>=6.0",
    "types-redis>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── ruff ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── mypy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_ignores = true

# ── pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no external dependencies)",
    "contract: storage contract tests (parametrized across backends)",
    "integration: tests requiring Redis",
    "concurrency: multi-task concurrency tests",
    "stress: long-running stress tests (manual/nightly)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
