user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: $upstream_addr rt=$request_time uct=$upstream_connect_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Upstream pool of 3 API replicas running round-robin
    upstream api_cluster {
        server api1:8000;
        server api2:8000;
        server api3:8000;

        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # Internal metric endpoints must NEVER be exposed publicly through the load balancer
        location /metrics {
            return 404;
        }

        # Proxy all traffic to the distributed API replicas
        location / {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL RULE (AGENTS.md §10):
            # Disable proxy retries on upstream failure so a failed attempt never double-counts.
            proxy_next_upstream off;

            # Forward client IP information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
