services:
  redis:
    image: redis:7-alpine
    container_name: rl-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 5
    restart: unless-stopped
